<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta-Transaction Hub - Storage DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof ethers === 'undefined') {
                document.body.innerHTML = '<div style="text-align:center;margin-top:100px;"><h1>❌ Error</h1><p>Could not load Ethers.js from CDN.</p><p>Check your internet connection and reload the page.</p></div>';
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #495057;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.secondary {
            background: #6c757d;
        }

        .current-value {
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.active {
            display: block;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .tx-link {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
        }

        .tx-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.8em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meta-Transaction Hub</h1>
        <p class="subtitle">Gasless transactions powered by EIP-712</p>

        <div id="alert" class="alert"></div>

        <div class="card">
            <div class="status">
                <div id="statusIndicator" class="status-indicator"></div>
                <span id="statusText">Not connected</span>
            </div>
            <div id="accountInfo" style="display: none;">
                <div class="info-row">
                    <span class="info-label">Your Wallet:</span>
                    <span id="userAddress" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Network:</span>
                    <span id="networkName" class="info-value"></span>
                </div>
            </div>
        </div>

        <button id="connectBtn" onclick="connectWallet()">
            🦊 Connect MetaMask
        </button>

        <div id="app" style="display: none;">
            <div class="card">
                <label>Current Stored Value</label>
                <div id="currentValue" class="current-value">-</div>
                <button class="secondary" onclick="refreshValue()">🔄 Refresh</button>
            </div>

            <div class="card">
                <div class="input-group">
                    <label>Store New Value</label>
                    <input 
                        type="number" 
                        id="newValue" 
                        placeholder="Enter a number"
                        min="0"
                    />
                </div>
                <button onclick="storeValue()">💾 Store Value</button>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div id="loadingText">Processing...</div>
            </div>

            <div class="card">
                <label>Contract Information</label>
                <div class="info-row">
                    <span class="info-label">Storage:</span>
                    <span id="storageAddress" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Hub:</span>
                    <span id="hubAddress" class="info-value"></span>
                </div>
            </div>
        </div>

        <footer>
            <p>Powered by PermissionedMetaTxHub v2.0</p>
            <a href="https://github.com" class="footer-link" target="_blank">View on GitHub</a>
        </footer>
    </div>

    <script>
        const CONFIG = {
            STORAGE_ADDRESS: '0x4dEF9c0002A872Bc63367cD7446ffB26f5248075',
            HUB_ADDRESS: '0xe8cB75877D6277bCD423f39177BbEB32eDbd899b',
            BACKEND_URL: 'http://localhost:3000',
            CHAIN_ID: 80002,
            NETWORK_NAME: 'Polygon Amoy'
        };

        const STORAGE_ABI = [
            'function retrieve() view returns (uint256)',
            'function store(uint256 _number)'
        ];

        let provider;
        let signer;
        let userAddress;
        let storageContract;
        let relayerAddress;

        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    showAlert('Please install MetaMask', 'error');
                    return;
                }

                showLoading('Connecting wallet...');

                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                const network = await provider.getNetwork();
                if (network.chainId !== CONFIG.CHAIN_ID) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x' + CONFIG.CHAIN_ID.toString(16) }],
                        });
                    } catch (error) {
                        showAlert('Please switch to Polygon Amoy', 'error');
                        hideLoading();
                        return;
                    }
                }

                storageContract = new ethers.Contract(
                    CONFIG.STORAGE_ADDRESS,
                    STORAGE_ABI,
                    provider
                );

                // Get relayer address from backend
                const statsResponse = await fetch(`${CONFIG.BACKEND_URL}/stats`);
                if (!statsResponse.ok) {
                    throw new Error('Could not connect to backend');
                }
                const stats = await statsResponse.json();
                relayerAddress = stats.relayer;

                console.log('🔧 Relayer address:', relayerAddress);

                updateConnectionUI();
                await refreshValue();

                hideLoading();
                showAlert('Successfully connected! 🎉', 'success');

            } catch (error) {
                console.error(error);
                hideLoading();
                showAlert('Connection error: ' + error.message, 'error');
            }
        }

        function updateConnectionUI() {
            document.getElementById('statusIndicator').classList.add('connected');
            document.getElementById('statusText').textContent = 'Connected';
            document.getElementById('userAddress').textContent = 
                userAddress.substring(0, 6) + '...' + userAddress.substring(38);
            document.getElementById('networkName').textContent = CONFIG.NETWORK_NAME;
            document.getElementById('storageAddress').textContent = 
                CONFIG.STORAGE_ADDRESS.substring(0, 10) + '...';
            document.getElementById('hubAddress').textContent = 
                CONFIG.HUB_ADDRESS.substring(0, 10) + '...';
            
            document.getElementById('accountInfo').style.display = 'block';
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        async function refreshValue() {
            try {
                const value = await storageContract.retrieve();
                document.getElementById('currentValue').textContent = value.toString();
            } catch (error) {
                console.error(error);
                document.getElementById('currentValue').textContent = 'Error';
            }
        }

        async function storeValue() {
            const newValueInput = document.getElementById('newValue');
            const newValue = newValueInput.value;

            if (!newValue || newValue === '') {
                showAlert('Please enter a value', 'error');
                return;
            }

            if (!relayerAddress) {
                showAlert('Error: relayer address not available', 'error');
                return;
            }

            try {
                showLoading('Preparing meta-transaction...');

                // Prepare calldata
                const iface = new ethers.utils.Interface(STORAGE_ABI);
                const callData = iface.encodeFunctionData('store', [newValue]);

                // Prepare meta-transaction
                const space = 1500; // Use same space as working script
                const nonce = Math.floor(Date.now() / 1000); // Use timestamp as nonce
                const deadline = Math.floor(Date.now() / 1000) + 3600; // 1 hour
                const dataHash = ethers.utils.keccak256(callData);

                // IMPORTANT: caller must be the relayer's address
                const forward = {
                    from: userAddress,
                    to: CONFIG.STORAGE_ADDRESS,
                    value: 0,
                    space,
                    nonce,
                    deadline,
                    dataHash,
                    caller: relayerAddress, // Use relayer address
                };

                console.log('📝 Forward request:', forward);

                // EIP-712 Domain
                const domain = {
                    name: 'PermissionedMetaTxHub',
                    version: '1',
                    chainId: CONFIG.CHAIN_ID,
                    verifyingContract: CONFIG.HUB_ADDRESS
                };

                // EIP-712 Types
                const types = {
                    Forward: [
                        { name: 'from', type: 'address' },
                        { name: 'to', type: 'address' },
                        { name: 'value', type: 'uint256' },
                        { name: 'space', type: 'uint32' },
                        { name: 'nonce', type: 'uint256' },
                        { name: 'deadline', type: 'uint256' },
                        { name: 'dataHash', type: 'bytes32' },
                        { name: 'caller', type: 'address' },
                    ]
                };

                showLoading('Sign the transaction in MetaMask...');

                // Sign
                const signature = await signer._signTypedData(domain, types, forward);
                console.log('✍️ Signature generated:', signature);

                showLoading('Sending to relayer...');

                // Send to backend
                const response = await fetch(`${CONFIG.BACKEND_URL}/relay`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        forward,
                        callData,
                        signature
                    })
                });

                let result;
                const contentType = response.headers.get('content-type');
                
                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    const text = await response.text();
                    console.error('Response is not JSON:', text);
                    throw new Error('Server did not respond with JSON. Check backend logs.');
                }

                if (!response.ok) {
                    console.error('❌ Server error:', result);
                    console.error('Details:', result.details);
                    console.error('Reason:', result.reason);
                    throw new Error(result.error || result.details || `HTTP Error: ${response.status}`);
                }

                showLoading('Waiting for confirmation...');

                // Wait for confirmation
                const receipt = await provider.waitForTransaction(result.txHash);

                hideLoading();

                if (receipt.status === 1) {
                    showAlert(
                        'Transaction successful! 🎉<br>' +
                        `Gas used: ${result.gasUsed}<br>` +
                        `<a href="${result.explorer}" target="_blank" class="tx-link">View on Explorer →</a>`,
                        'success'
                    );
                    await refreshValue();
                    newValueInput.value = '';
                } else {
                    showAlert('Transaction failed', 'error');
                }

            } catch (error) {
                console.error('❌ Complete error:', error);
                hideLoading();
                
                let errorMsg = error.message;
                if (error.code === 'ACTION_REJECTED') {
                    errorMsg = 'Signature rejected by user';
                } else if (errorMsg.includes('rate limit')) {
                    errorMsg = 'Too many requests. Please wait a moment.';
                }
                
                showAlert('Error: ' + errorMsg, 'error');
            }
        }

        function showLoading(text) {
            document.getElementById('loading').classList.add('active');
            document.getElementById('loadingText').textContent = text;
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.innerHTML = message;
            alert.className = `alert ${type} active`;
            setTimeout(() => {
                alert.classList.remove('active');
            }, 5000);
        }

        // Event listeners for account/network changes
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    location.reload();
                } else {
                    connectWallet();
                }
            });

            window.ethereum.on('chainChanged', () => {
                location.reload();
            });
        }
    </script>
</body>
</html>
